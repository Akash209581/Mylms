# ==============================================================================
# LMS Production Hardened Nginx Configuration
# Project Location: /data/Mylms
# Server IP: 160.187.169.41
# Frontend Path: https://160.187.169.41/mmadastemlab/
# ==============================================================================

# --- Rate Limiting Zones (DDoS & Brute Force Protection) ---
limit_req_zone $binary_remote_addr zone=api_general:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=auth_strict:10m rate=5r/s;

# --- HTTP (Port 80) -> Immediate 301 Redirect to HTTPS ---
server {
    listen 80;
    listen [::]:80;
    server_name 160.187.169.41;

    # Security: Hide Nginx version
    server_tokens off;

    # Redirect all HTTP requests to HTTPS
    return 301 https://$host$request_uri;
}

# --- HTTPS (Port 443) Server Block ---
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name 160.187.169.41;

    # Hide Nginx version banner
    server_tokens off;

    # --- SSL / TLS Configuration ---
    ssl_certificate /etc/ssl/certs/lms.crt;
    ssl_certificate_key /etc/ssl/private/lms.key;

    # Modern TLS protocols only (TLSv1.0 & TLSv1.1 disabled)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # --- Security Headers ---
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # --- Buffer & Timeout Protections ---
    client_max_body_size 100M;
    client_body_buffer_size 128k;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 8k;
    client_body_timeout 30s;
    client_header_timeout 30s;
    keepalive_timeout 65s;
    send_timeout 30s;

    # --- 1. Block Hidden & Sensitive Files (.git, .env, .htaccess, scripts, backups) ---
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~* \.(bak|config|sql|fla|psd|ini|log|sh|inc|swp|dist|env)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # --- 2. Root Redirect: Redirect '/' to '/mmadastemlab/' ---
    location = / {
        return 301 /mmadastemlab/;
    }

    # --- 3. LMS Frontend (Next.js App on port 3000) ---
    location /mmadastemlab {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # WebSocket & Upgrade headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Standard Proxy Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120s;
    }

    # --- 4. LMS Backend API (NestJS API on port 3003) ---
    location /api/ {
        proxy_pass http://127.0.0.1:3003/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    # --- 5. Uploads: Direct disk serving with proxy fallback ---
    location /uploads/ {
        alias /data/Mylms/LMS-backend/uploads/;
        try_files $uri @lms_backend_uploads;

        add_header X-Content-Type-Options "nosniff" always;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Named location MUST NOT have a URI path in proxy_pass
    location @lms_backend_uploads {
        proxy_pass http://127.0.0.1:3003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- 6. Compiler Service (Flask on port 5000) ---
    location /compiler/ {
        proxy_pass http://127.0.0.1:5000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
